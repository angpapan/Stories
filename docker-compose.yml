version: '3.8'

services:
  api:
    container_name: stories-api
    build:
      context: .
      dockerfile: InteractiveStory.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/InteractiveStory.db
    volumes:
      - stories-data:/app/data
      - stories-media:/app/wwwroot/media
    restart: unless-stopped
    networks:
      - stories-internal

  frontend:
    container_name: stories-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - stories-internal
      - caddy_network

networks:
  stories-internal:
    driver: bridge
  caddy_network:
    name: caddy_network
    external: true

volumes:
  stories-data:
  stories-media:

